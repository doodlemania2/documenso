# Tells the tdpdf-site receivers that the app changed (fleet-presence STANDARD.md, requirement 7).
# Only changes that can alter what users see or what the changelog says dispatch: the patches, the upstream pin,
# the feature list, the AGPL change record and the compose files. Bot "deploy: pin" merges touch only
# deploy/docker-compose.image.yml, which is deliberately not listed.
# Without FLEET_DISPATCH_TOKEN the shared workflow warns and exits 0; the sites' nightly runs are the fallback.
name: presence-dispatch

on:
  push:
    branches: [main]
    paths:
      - 'fork/patches/**'
      - 'fork/pins.env'
      - 'fork/build.sh'
      - 'presence/**'
      - 'CHANGES.md'
      - 'deploy/docker-compose.yml'
      - 'deploy/docker-compose.azure-kv.yml'
      - '.github/workflows/presence-dispatch.yml'

permissions:
  contents: read

jobs:
  presence:
    # documenso is a public repo, so GitHub-hosted runners are allowed (the dispatch itself is a few curl calls).
    uses: doodlemania2/fleet-presence/.github/workflows/presence-dispatch.yml@main
    with:
      property: documenso
      targets: '["doodlemania2/tdpdf-site"]'
      runner: ubuntu-latest
    secrets:
      dispatch_token: ${{ secrets.FLEET_DISPATCH_TOKEN }}

  notify-failure:
    needs: [presence]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post a failure notice to ntfy
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # A failed notice must never fail the job, and the URL is a secret: no echo, no curl stderr.
        run: |
          curl -fsS -m 20 -X POST \
            -H "Title: documenso presence-dispatch failed" \
            -H "Priority: default" \
            -H "Tags: warning" \
            -d "presence-dispatch failed. ${RUN_URL}" \
            "$NTFY_URL" >/dev/null 2>&1 || true
